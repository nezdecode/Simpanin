# SwiftLint checks naming, size and code smells. Layout (indentation, line breaks,
# trailing commas) belongs to swift-format, configured in .swift-format.

included:
  - Packages/VaultCore/Sources
  - Packages/VaultCore/Tests
  - Simpanin
  - SimpaninTests
  - SimpaninUITests

excluded:
  - "**/.build"
  - "**/Package.swift"  # its first line must be swift-tools-version, so it has no header

disabled_rules:
  # Layout rules that swift-format already decides.
  - trailing_comma  # swift-format adds trailing commas to multiline collections
  - opening_brace   # swift-format puts the brace on its own line after a wrapped signature
  # Stored raw values are written out on purpose (see CODING.md, Values).
  - redundant_string_enum_value

opt_in_rules:
  - file_header
  - closure_spacing
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120  # the same as swift-format's lineLength
  ignores_urls: true

large_tuple:
  warning: 4  # (vault, store, ktp, sim) from a test helper reads fine
  error: 5

identifier_name:
  excluded:  # short names that are clearer than a long one
    - id
    - i   # loop index
    - dk  # document key, the design doc's term
    - kk  # Kartu Keluarga, a document type
    - t0  # a test's start time

file_header:  # Xcode's header plus the MPL notice, see CODING.md
  required_pattern: |
    \/\/
    \/\/  SWIFTLINT_CURRENT_FILENAME
    \/\/  (Simpanin|SimpaninTests|SimpaninUITests|VaultCore|VaultCoreTests|Parsers|ParsersTests)
    \/\/
    \/\/  Created by .+ on \d{1,2}\/\d{1,2}\/\d{2}\.
    \/\/
    \/\/  This Source Code Form is subject to the terms of the Mozilla Public
    \/\/  License, v\. 2\.0\. If a copy of the MPL was not distributed with this
    \/\/  file, You can obtain one at https:\/\/mozilla\.org\/MPL\/2\.0\/\.
    \/\/

custom_rules:
  vaultcore_imports:
    name: VaultCore imports
    message: "VaultCore imports only Foundation and Crypto."
    included: "Packages/VaultCore/Sources/VaultCore/.*\\.swift"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+(?!(Foundation|Crypto)\\b)\\w+"
    severity: error
  # Recognition (Vision) stays in the app, so the parsers are tested on plain text on a Mac.
  parsers_imports:
    name: Parsers imports
    message: "Parsers imports only Foundation and VaultCore."
    included: "Packages/VaultCore/Sources/Parsers/.*\\.swift"
    regex: "^\\s*(@\\w+(\\([^)]*\\))?\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+(?!(Foundation|VaultCore)\\b)\\w+"
    severity: error
  # The rules below check the app. They match paths, and the repository folder itself may be
  # called Simpanin, so they include everything under it and exclude the tests and VaultCore.
  color_by_name:
    name: Colour by name
    message: "Use the asset catalog's generated symbol, Color(.name): a mistyped name compiles and shows nothing."
    included: "/Simpanin/.*\\.swift"
    excluded: "/(SimpaninTests|SimpaninUITests|Packages)/"
    regex: "\\b(Color\\(|UIColor\\(named: )\""
    excluded_match_kinds: [comment, doccomment]
    severity: error
  vault_file_names:
    name: Vault file names
    message: "VaultCore owns its file names; use VaultStore.headerFileName or ask VaultStore."
    included: "/Simpanin/.*\\.swift"
    excluded: "/(SimpaninTests|SimpaninUITests|Packages)/"
    regex: "\"(vault\\.json|index\\.enc|index\\.prev\\.enc)\""
    excluded_match_kinds: [comment, doccomment]
    severity: error
  design_system_without_domain:
    name: DesignSystem knows no domain
    message: "DesignSystem/ holds views and styles with no domain knowledge: no VaultCore or Parsers import, and no Platform, Documents/ or feature types (CODING section 1)."
    included: "/Simpanin/DesignSystem/.*\\.swift"
    regex: "^\\s*(@\\w+\\s+)*((public|package|internal|fileprivate|private)\\s+)?import\\s+(\\w+\\s+)?(VaultCore|Parsers)\\b"
    severity: error
  hand_built_dates:
    name: Hand-built date formats
    message: "Use the FormatStyles in Documents/Date+Indonesian.swift; the device's own locale and formats are not what Simpanin shows."
    included: "/Simpanin/.*\\.swift"
    excluded: "(/(SimpaninTests|SimpaninUITests|Packages)/|/Documents/Date\\+Indonesian\\.swift$)"
    regex: "(\\bDateFormatter\\(\\)|Locale\\(identifier: \"id([-_]ID)?\"\\)|\\.formatted\\((date|time):)"
    excluded_match_kinds: [comment, doccomment]
    severity: error
  no_print:
    name: No print
    message: "Use Logger, and never log field values, names, numbers, keys or file contents."
    included: "/(Simpanin|Packages/VaultCore/Sources)/.*\\.swift"
    excluded: "/(SimpaninTests|SimpaninUITests|Tests)/"
    regex: "\\b(print|debugPrint|dump|NSLog)\\("
    excluded_match_kinds: [comment, doccomment, string]
    severity: error
  british_identifiers:
    name: American spelling in identifiers
    message: "Identifiers use American spelling, like Apple's APIs: color, not colour."
    included: ".*\\.swift"
    regex: "[A-Za-z]*([Cc]olour|[Bb]ehaviour|[Ff]avourite|[Cc]entre|[Gg]rey|[Ll]icence|[Cc]atalogue|[Ii]nitialis|[Oo]rganis|[Nn]ormalis|[Rr]ecognis|[Ss]ummaris|[Aa]uthoris|[Cc]ustomis)[A-Za-z]*"
    match_kinds:
      - identifier
    severity: error
