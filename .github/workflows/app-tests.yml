# The app's unit and UI tests on GitHub's macOS image, with the same Xcode as the Mac, for pull requests from
# forks, and for every pull request while the repository variable APP_TESTS_ON_GITHUB is true (when the
# maintainer's Mac is away). Otherwise scripts/ci-mac.sh runs them on the Mac and posts "App tests (Mac)":
# these machines failed on their own more often than on the tests. A fork that edits the condition below
# only changes which of GitHub's machines it runs on; nothing here reaches the Mac.
# UI tests take about 40 minutes one after another, so three jobs split them by class. Like checks.yml, they
# advise and don't block: check them before merging (CONTRIBUTING.md).
name: App tests

on:
  pull_request:
    branches: [main]
    # Not ready_for_review: a draft's commits have already run, and a rerun takes half an hour.
    types: [opened, synchronize, reopened]

concurrency:
  group: app-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    if: github.event.pull_request.head.repo.full_name != github.repository || vars.APP_TESTS_ON_GITHUB == 'true'
    runs-on: xcode-27
    # Time for test.sh's one retry of a hung run: twice the longest job (46 min), plus 15. When a job passes
    # 40 min on two pull requests, rebalance the classes below by the times test.sh prints, or add a job.
    timeout-minutes: 110
    strategy:
      # A flake in one job shouldn't cancel the others.
      fail-fast: false
      # Balanced by each class's time in a full run, about 13 minutes of UI tests each on the Mac. The last
      # job runs everything the others don't, so a new class or target is never left out. A class that
      # leaves part 1 or 2 leaves the last job's --skip list too, or no job runs it.
      matrix:
        include:
          - name: Unit tests and UI tests, part 1
            args: >-
              --only SimpaninTests
              --only SimpaninUITests/EditDocumentUITests --only SimpaninUITests/ShareUITests
              --only SimpaninUITests/LibraryUITests --only SimpaninUITests/LockCoverUITests
              --only SimpaninUITests/ReviewMarksUITests
          - name: UI tests, part 2
            args: >-
              --only SimpaninUITests/DeletedDetailUITests --only SimpaninUITests/DocumentDetailUITests
              --only SimpaninUITests/ScanFlowUITests --only SimpaninUITests/DocumentPagesUITests
              --only SimpaninUITests/SettingsUITests
          - name: UI tests, the rest
            args: >-
              --skip SimpaninTests
              --skip SimpaninUITests/EditDocumentUITests --skip SimpaninUITests/ShareUITests
              --skip SimpaninUITests/LibraryUITests --skip SimpaninUITests/LockCoverUITests
              --skip SimpaninUITests/ReviewMarksUITests
              --skip SimpaninUITests/DeletedDetailUITests --skip SimpaninUITests/DocumentDetailUITests
              --skip SimpaninUITests/ScanFlowUITests --skip SimpaninUITests/DocumentPagesUITests
              --skip SimpaninUITests/SettingsUITests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Xcode the Mac builds with; the image's default is newer. Move it when the Mac's Xcode moves.
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app
      # Only test.sh's summary reaches this public log: test names, counts and build errors, never a
      # failure's message or the app's logs. Nothing is uploaded; a failure is rerun on the Mac with --only.
      - run: scripts/test.sh ${{ matrix.args }}
